name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x android/gradlew

      - name: Check balance constants
        run: python tools/equilibrage/check_constants.py

      - name: Check file encoding
        run: python tools/check_encoding.py

      - name: Unit tests, lint and debug APK
        working-directory: android
        run: ./gradlew :app:testGithubDebugUnitTest :app:lintGithubDebug :app:assembleGithubDebug --console=plain --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-github-debug
          path: android/app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-githubDebug.html
          if-no-files-found: ignore
